name: Refresh data

# Раз в сутки. Обновление данных не требует человека: это загрузка снапшота,
# пересборка брифов и коммит. Всё это бесплатно на любом расписании.
#
# Генерация текстов идёт ПОСЛЕ коммита данных, вызывается только когда в
# данных что-то произошло, и пишет в pull request, а не в main. Человек
# читает текст до того, как тот попадает на сайт. Уведомление приходит в
# Telegram: почту здесь не читают, а непрочитанное уведомление это то же
# самое, что его отсутствие.

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest

    # Секреты объявлены на уровне job, потому что шаговое условие if: читает
    # контекст env, а не secrets. Без этого шаг генерации пропускался бы молча.
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      VICTIM_HASH_SALT: ${{ secrets.VICTIM_HASH_SALT }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Соль обязана совпадать с той, из которой посчитаны закоммиченные
      # отпечатки. При расхождении salt_id гард утечки не нашёл бы ни одного
      # совпадения и молча пропустил бы всё, поэтому проверка стоит до загрузки.
      - name: Check the salt is present
        run: |
          if [ -z "$VICTIM_HASH_SALT" ]; then
            echo "::error::Секрет VICTIM_HASH_SALT не задан. Отпечатки посчитались бы другой солью."
            exit 1
          fi

      # Лоадер сам откажется записать подозрительный снапшот: падение числа
      # записей больше чем на 10% или исчезновение сектора либо группы
      # останавливают запись. Обрезанный ответ выглядит как успех и молча
      # удалил бы страницы, поэтому эта защита важнее ретраев.
      - name: Fetch snapshot
        run: npm run fetch:all

      # Брифы коммитятся вместе с данными. Если бы они отставали, сверка чисел
      # подтверждала бы устаревшие цифры с той же уверенностью, что и свежие.
      - name: Rebuild briefs
        run: npm run briefs

      - name: Commit if the data moved
        id: commit
        run: |
          git config user.name  "marsad-data-bot"
          git config user.email "noreply@users.noreply.github.com"
          git add src/data briefs
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Данные не изменились, коммита нет."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git commit -m "Data refresh $(date -u +%Y-%m-%d)"
            git push
          fi

      # Условие только на ключ. Привязка к «данные сдвинулись» выглядела
      # экономнее, но пропускала главный случай: сборка красная со вчера, а
      # сегодня снапшот не изменился, и чинить никто не приходит. Сломанный
      # файл держит сайт на прошлой версии независимо от того, двигались ли
      # данные в этом прогоне.
      #
      # Расход от этого не растёт. Генератор сам считает задачи и при пустом
      # списке выходит, не сделав ни одного вызова API.
      - name: Write the text the new data needs
        id: generate
        if: env.ANTHROPIC_API_KEY != ''
        run: npm run generate

      # Зелёное публикуется сразу в main.
      #
      # Сначала текст уходил в pull request и ждал человека. За девять дней
      # накопилось восемь непрочитанных PR, main всё это время оставался
      # красным, и каждую ночь генератор заново чинил те же файлы, потому что
      # починка лежала в ветке, а не в main. Платили за одну и ту же работу
      # девять раз, и сайт всё равно стоял.
      #
      # Доверие здесь не к модели, а к тому, что её уже проверило: линтер
      # сверил каждое число с брифом, и полная сборка со всеми гардами прошла.
      # Это ровно тот набор проверок, после которого мы и мёржили руками.
      - name: Publish when the full build passed
        id: publish
        if: steps.generate.outputs.written != '' && steps.generate.outputs.written != '0'
        run: |
          DAY=$(date -u +%Y-%m-%d)
          git add src/content
          if git diff --cached --quiet; then
            echo "Генератор ничего не сохранил."
            exit 0
          fi

          if [ "${{ steps.generate.outputs.build_ok }}" = "true" ]; then
            git commit -m "Editorial text for the $DAY refresh"
            git push
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "url=${{ github.server_url }}/${{ github.repository }}/commit/$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          else
            # Сборка не прошла — в main такое не попадает. Ветка и pull
            # request существуют ровно для этого случая.
            BRANCH="content/review-$DAY-$(date -u +%H%M)"
            git checkout -b "$BRANCH"
            git commit -m "Editorial text for the $DAY refresh (needs review)"
            git push --set-upstream origin "$BRANCH"
            {
              echo "Полная сборка на этой ветке НЕ проходит. В main не публикуется."
              echo
              cat /tmp/marsad-summary.txt
            } > /tmp/marsad-pr-body.txt
            PR=$(gh pr create --title "Needs review: $DAY refresh" \
                 --body-file /tmp/marsad-pr-body.txt --base main)
            echo "review=$PR" >> "$GITHUB_OUTPUT"
            git checkout main
          fi

      - name: Tell Telegram the site was updated
        if: steps.publish.outputs.published == 'true'
        run: |
          {
            echo "<b>Marsad: сайт обновлён</b>"
            echo
            # Только итоговые строки. Перечень файлов занимал весь экран и
            # ничего не сообщал: решение по нему всё равно не принимают.
            grep -E '^(Готово|Без API|Вызовов|Полная сборка)' /tmp/marsad-summary.txt
            echo
            echo "${{ steps.publish.outputs.url }}"
          } | node scripts/notify-telegram.mjs

      - name: Tell Telegram a branch needs review
        if: steps.publish.outputs.review != ''
        run: |
          {
            echo "<b>Marsad: нужна проверка руками</b>"
            echo "Текст написан, но сборка на ветке не проходит. В main ничего не ушло."
            echo
            echo "${{ steps.publish.outputs.review }}"
          } | node scripts/notify-telegram.mjs

      # Последний гард. Генератор уже собирал сайт, но этот шаг ловит и те
      # прогоны, где генератор не запускался вовсе: нет ключа, нет задач,
      # или сломалось что-то помимо текста.
      - name: Verify the site still builds against the new data
        run: npm run build

      - name: Tell Telegram the run failed
        if: failure()
        run: |
          {
            echo "<b>Marsad: прогон упал</b>"
            echo "Сайт продолжает отдавать прошлую корректную версию."
            echo "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } | node scripts/notify-telegram.mjs
